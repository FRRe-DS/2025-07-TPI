<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal de Compras</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'portal_compras/css/css.css' %}">
    <style>
        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            background: #88e;
            border-radius: 12px;
            text-align: center;
        }
        .btn-keycloak {
            width: 100%;
            background: #1d9bd1;
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            margin: 2rem 0;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .btn-keycloak:hover {
            background: #1a82b0;
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        .keycloak-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="header__logo-container">
            <img class="header__logo" src="https://imgs.search.brave.com/xXu0HqkEYT9th61dMNlPQQL0e4y15tfFDRslLHKcvJY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pLnJl/ZGQuaXQvY2Z3eXNz/OTA1bWtjMS5wbmc" alt="Logo">
        </div>
        
        <nav class="navbar">
            <ul class="list">
                <li class="header__nav-item"><a class="btn" href="{% url 'index' %}">Home</a></li>
                <li class="header__nav-item"><a class="btn" href="{% url 'productos' %}">Productos</a></li>
            </ul>
            <div class="header__buttons-container">
                <a href="{% url 'login' %}" class="btn btn--login">Log In</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <h2>Iniciar Sesión</h2>
            
            <div class="keycloak-info">
                <p>🔐 Usa tu cuenta de Keycloak para acceder al sistema</p>
            </div>

            <!-- Único botón - Keycloak -->
            <a href="{% url 'social:begin' 'keycloak' %}?next={{ request.GET.next|default:'/api/' }}" class="btn-keycloak">
                🔐 Iniciar Sesión con Keycloak
            </a>

            <p><small>Serás redirigido a Keycloak para autenticarte</small></p>
        </div>
    </main>

    <script>
        // Verificar si ya está autenticado
        {% if user.is_authenticated %}
            window.location.href = '{% url "index" %}';
        {% endif %}
    </script>
</body>
</html>
