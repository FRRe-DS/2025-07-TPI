<!-- templates/portal_compras/registro.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Portal de Compras</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'portal_compras/css/css.css' %}">
    <style>
        .form-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            background: #88e;
            border-radius: 12px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            width: 100%;
            background: #83e;
            color: white;
            padding: 0.7rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="header__logo-container">
            <img class="header__logo" src="https://imgs.search.brave.com/xXu0HqkEYT9th61dMNlPQQL0e4y15tfFDRslLHKcvJY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pLnJl/ZGQuaXQvY2Z3eXNz/OTA1bWtjMS5wbmc" alt="Logo">
        </div>
        
        <nav class="navbar">
            <ul class="list">
                <li class="header__nav-item"><a class="btn" href="{% url 'index' %}">Home</a></li>
                <li class="header__nav-item"><a class="btn" href="{% url 'productos' %}">Productos</a></li>
            </ul>
            <div class="header__buttons-container">
                <a href="{% url 'login' %}" class="btn btn--login">Log In</a>
                <a href="{% url 'registro' %}" class="btn btn--Sign_Up">Sign Up</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Crear Cuenta</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" name="firstName" required>
                </div>
                <div class="form-group">
                    <label>Apellido:</label>
                    <input type="text" name="lastName" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" name="password" required minlength="8">
                </div>
                <div class="form-group">
                    <label>Confirmar Contraseña:</label>
                    <input type="password" name="confirmPassword" required>
                </div>
                <button type="submit" class="btn-submit">Registrarse</button>
            </form>
            <div id="message" style="margin-top: 1rem;"></div>
        </div>
    </main>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                firstName: formData.get('firstName'),
                lastName: formData.get('lastName'),
                email: formData.get('email'),
                password: formData.get('password'),
                confirmPassword: formData.get('confirmPassword')
            };

            // Validación frontend
            if (data.password !== data.confirmPassword) {
                document.getElementById('message').innerHTML = 
                    '<p style="color: red;">❌ Las contraseñas no coinciden</p>';
                return;
            }

            try {
                const response = await fetch('{% url "registro" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('message').innerHTML = 
                        '<p style="color: green;">✅ Registro exitoso! Redirigiendo al login...</p>';
                    setTimeout(() => {
                        window.location.href = '{% url "login" %}';
                    }, 2000);
                } else {
                    document.getElementById('message').innerHTML = 
                        `<p style="color: red;">❌ ${result.error}</p>`;
                }
            } catch (error) {
                document.getElementById('message').innerHTML = 
                    '<p style="color: red;">❌ Error de conexión</p>';
            }
        });
    </script>
</body>
</html>
